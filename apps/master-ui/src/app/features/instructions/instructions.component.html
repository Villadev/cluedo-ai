<div class="p-4">
  <h1 class="text-3xl font-bold mb-4">Instruccions del Joc</h1>

  @if (error()) {
    <div class="mb-4">
      <p-message severity="error" [text]="error() || ''"></p-message>
    </div>
  }

  @if (instructions()) {
    <div class="flex flex-column gap-4">
      <p-card header="Com jugar" styleClass="shadow-2">
        <div class="white-space-pre-wrap line-height-3 text-lg">
          {{ instructions() }}
        </div>
      </p-card>

      <p-card header="Objectiu del joc" styleClass="shadow-2 border-left-3 border-primary">
        <div class="text-lg">
          <p class="mb-3">L'objectiu dels investigadors és descobrir:</p>
          <ul class="list-none p-0 m-0 flex flex-column gap-2">
            <li class="flex align-items-center gap-2">
              <i class="pi pi-user text-primary font-bold"></i>
              <span><strong>Qui</strong> és l'assassí</span>
            </li>
            <li class="flex align-items-center gap-2">
              <i class="pi pi-hammer text-primary font-bold"></i>
              <span> Amb <strong>quina arma</strong></span>
            </li>
            <li class="flex align-items-center gap-2">
              <i class="pi pi-map-marker text-primary font-bold"></i>
              <span><strong>On</strong> es va produir el crim</span>
            </li>
          </ul>
        </div>
      </p-card>
    </div>
  } @else if (!loading() && !error()) {
    <div class="text-center p-4">
      <p class="text-gray-500">No hi ha instruccions disponibles.</p>
    </div>
  }

  @if (loading()) {
    <div class="flex justify-content-center p-4">
      <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
    </div>
  }
</div>
