<header class="layout-topbar surface-card border-bottom-1 surface-border">
  <button
    pButton
    pRipple
    type="button"
    icon="pi pi-bars"
    class="menu-toggle p-button-text p-button-rounded"
    aria-label="Obre o tanca el menú"
    (click)="onMenuToggle()"
  ></button>

  <img src="/assets/ruralmind-logo.png" class="app-logo" alt="Rural Mind" />

  <div class="layout-topbar-actions flex align-items-center gap-3">
    @if (gameId()) {
      <app-game-status-indicator [gameId]="gameId()!"></app-game-status-indicator>
    }

  </div>
</header>
