name: Backend generation
on:
  pull_request:
    paths: ['apps/backend/**', 'tsconfig.base.json', '.github/workflows/backend-generation.yml']
  push:
    branches: ['main']
    paths: ['apps/backend/**', 'tsconfig.base.json', '.github/workflows/backend-generation.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --workspaces=false --ignore-scripts --package-lock=false
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
